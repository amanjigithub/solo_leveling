[build]
  publish = "dist"
  command = "npm run build"

# ── Secrets scanning config ──────────────────────────────────────────────────
# Netlify's secrets scanner detects env var values in built files and fails
# the build. Vite intentionally bakes VITE_* values into JS bundles — that's
# how it works. We tell the scanner to skip the assets folder.
# Without this, Netlify falls back to the last successful build (stale code).
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "dist/assets"


[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

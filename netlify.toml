[build]
  publish = "dist"
  command = ""
  # command="" explicitly tells Netlify: NO BUILD — serve dist/ from git as-is.
  # Without this explicit empty string, Netlify falls back to the dashboard setting
  # (npm run build), which causes secrets scanner failures and version mismatches.
  # Workflow: npm run build locally → commit dist/ → git push → Netlify hosts files.



[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

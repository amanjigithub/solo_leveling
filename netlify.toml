[build]
  publish = "dist"
  command = "npm run build"

# ── Secrets scanning ────────────────────────────────────────────────────────
# Netlify scans build output for secret values. Vite intentionally bakes
# VITE_* env vars into JS bundles at build time — this is by design.
# We tell the scanner to skip compiled output so it doesn't false-positive.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "dist/,functions/index.js,src/utils.js"


[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

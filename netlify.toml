[build]
  publish = "dist"
  # NO build command — Netlify serves our pre-built dist/ from git directly.
  # We build locally (npm run build) with our .env keys, then commit dist/.
  # This avoids: secrets scanner failures, missing env vars, version mismatches.
  # Workflow: npm run build → git add dist/ → git commit → git push → done.



[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

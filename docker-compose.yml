version: "3.9"

# ─────────────────────────────────────────────
# Solo Leveling — Docker Compose
#
# Usage:
#   Production:  docker compose up --build
#   Dev server:  docker compose --profile dev up
# ─────────────────────────────────────────────

services:

  # ── Production ──────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        # Vite embeds these at build time — read from your .env file
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
    image: solo-leveling:latest
    container_name: solo-leveling-prod
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Development (hot reload via Vite) ───────
  dev:
    profiles: [dev]
    image: node:20-alpine
    container_name: solo-leveling-dev
    working_dir: /app
    volumes:
      - .:/app                        # Live mount source for HMR
      - /app/node_modules             # Anonymous volume — keeps container's node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env                          # Load VITE_* vars from your .env
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

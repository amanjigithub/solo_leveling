server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cache static assets aggressively (JS/CSS have hashed names from Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes serve index.html (matches Netlify redirect)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy
    # Covers: Firebase Auth, Firestore, Firebase Functions, Google Sign-In, OpenRouter AI, Google Fonts
    add_header Content-Security-Policy "
        default-src 'self';
        script-src  'self' 'unsafe-inline' https://apis.google.com https://accounts.google.com;
        style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src    'self' https://fonts.gstatic.com;
        connect-src 'self'
                    https://*.googleapis.com
                    https://*.firebaseio.com
                    https://*.firebaseapp.com
                    https://identitytoolkit.googleapis.com
                    https://securetoken.googleapis.com
                    https://openrouter.ai
                    https://us-central1-*.cloudfunctions.net;
        frame-src   https://accounts.google.com https://*.firebaseapp.com;
        img-src     'self' data: https://*.googleusercontent.com;
        object-src  'none';
        base-uri    'self';
    " always;
}
